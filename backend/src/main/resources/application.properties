spring.application.name=backend

# 冒號後為本機預設值；部署時用環境變數覆蓋
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meetmeetme}
spring.datasource.username=${DB_USER:meetmeetme}
spring.datasource.password=${DB_PASSWORD:localdev}

# Cloud Run 會給 PORT
server.port=${PORT:8080}

# 錯誤回傳 RFC 9457 格式，detail 放中文訊息給前端顯示
spring.mvc.problemdetails.enabled=true

# 上傳照片：本機存放位置與大小上限
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
# 認證可一次上傳多個檔案
spring.servlet.multipart.max-request-size=16MB

# 認證文件（證件、自拍、財力證明）：不公開，只有管理員能讀
app.private-dir=${PRIVATE_DIR:private-uploads}

# 模擬簡訊時把驗證碼回傳給前端顯示；接上真的簡訊商後設為 false
app.sms.expose-code=${SMS_EXPOSE_CODE:true}
